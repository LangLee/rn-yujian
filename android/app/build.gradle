/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

// 渔见后端地址：优先读 .env（react-native-config），否则读环境变量，与原 Android 工程的 BuildConfig 字段同名


def envOrFallback = { String key ->
    def value = ""
    try {
        value = project.env.getOrEmpty(key)
    } catch (ignored) {
        value = ""
    }
    if (value == null || value.toString().trim().isEmpty()) {
        value = System.getenv(key) ?: ""
    }
    return value.toString()
}

def quoted = { String value ->
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def feedbackBaseUrl = envOrFallback('YUJIAN_FEEDBACK_BASE_URL')
def fishKnowledgeBaseUrl = envOrFallback('YUJIAN_FISH_KNOWLEDGE_BASE_URL').trim().isEmpty() ? feedbackBaseUrl : envOrFallback('YUJIAN_FISH_KNOWLEDGE_BASE_URL')
def userApiBaseUrl = envOrFallback('YUJIAN_API_BASE_URL').trim().isEmpty() ? feedbackBaseUrl : envOrFallback('YUJIAN_API_BASE_URL')
def feedbackIngestKey = envOrFallback('YUJIAN_FEEDBACK_INGEST_KEY')

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.yujian.ai.rn"
    defaultConfig {
        applicationId "com.yujianai"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.0"
        multiDexEnabled true

        // 渔见后端配置，与原 Android 工程 BuildConfig 字段同名
        buildConfigField "String", "FEEDBACK_BASE_URL", quoted(feedbackBaseUrl)
        buildConfigField "String", "FEEDBACK_INGEST_KEY", quoted(feedbackIngestKey)
        buildConfigField "String", "FISH_KNOWLEDGE_BASE_URL", quoted(fishKnowledgeBaseUrl)
        buildConfigField "String", "USER_API_BASE_URL", quoted(userApiBaseUrl)
        
        // react-native-config
        resValue "string", "build_config_package", "com.yujian.ai.rn"
    }
    
    // 启用 APK 拆分，为不同架构生成独立 APK
    // 这样每个 APK 只包含一个架构的原生库，大幅减少体积
    splits {
        abi {
            reset()
            enable true
            universalApk false  // 不生成包含所有架构的通用 APK
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'  // 主流架构 + 模拟器调试
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('release.jks')
            storePassword 'll1126!!@^'
            keyAlias 'key0'
            keyPassword 'll1126!!@^'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true 
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            
            // 启用 R8 完全模式以获得更好的优化
            // 移除未使用的资源和代码
        }
    }
    
    buildFeatures {
        buildConfig true
    }

    // 打包选项优化
    packagingOptions {
        // 原推理工程要求：ONNX/TFLite 原生库不解压加载
        jniLibs {
            useLegacyPackaging = true
        }
        // 排除不必要的文件
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/{AL2.0,LGPL2.1}'
        exclude 'META-INF/*.kotlin_module'
    }
}

// ---- 渔见端侧模型资产下载门禁（对齐原工程 CI：先下载校验，再打包）----
// 模型二进制不进 git，每次构建前由 fetchModelAssets 确保就位：
// 已存在且哈希匹配时直接跳过；缺失或不匹配才从模型工厂 Release 重新下载。
// 版本与代码侧硬校验配套：classifier 的 SHA256 写死在 FishRecognitionEngine，
// detector 通过 detector_metadata.json 与 onnx 二进制自洽校验；升级模型时需同步改这里。
def modelReleaseBase = "https://github.com/pan277942135/Yujian/releases/download"
def classifierReleaseUrl = "${modelReleaseBase}/mobile-model-v0.2/fish_classifier_v0_2.tflite"
def detectorBundleUrl = "${modelReleaseBase}/detector-model-v0.1/det_fish_v0_1_android_bundle.zip"
// 2026-09-29 模型工厂再次向同一 Release 资产位重新发布了 classifier（MODEL_CROP_M1_v0.2，
// DS_M1_v1.1，15 类：移除 other_freshwater_fish），旧 16 类文件已被覆盖删除，
// 常量以 mobile-model-v0.2 的 export_report.json / fish_classifier_v0_2.metadata.json 为准。
def classifierSha256 = "29c2f2fd1608178f023b8e35edf632c0dd685df4a7ae1c3562220a7352ccce18"
def classifierBytes = 6244908L
def modelAssetsDir = file("src/main/assets")
// bundle 里只有这三个文件属于 App 资产；golden_cases.json 与 golden/*.jpg 是 CI 黄金回归用的
def detectorBundleMembers = [
    "fish_detector_yolox_nano_v0_1.onnx",
    "detector_metadata.json",
    "recognition_pipeline_v1.json",
] as Set

def sha256Of = { File f ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    f.eachByte(1024 * 1024) { byte[] buffer, int len ->
        digest.update(buffer, 0, len)
    }
    digest.digest().collect { String.format("%02x", it) }.join()
}

def downloadTo = { String url, File dest ->
    dest.parentFile?.mkdirs()
    def conn = new URL(url).openConnection()
    conn.setConnectTimeout(30_000)
    conn.setReadTimeout(300_000)
    conn.getInputStream().withCloseable { input ->
        dest.withOutputStream { output ->
            byte[] buffer = new byte[64 * 1024]
            int read
            while ((read = input.read(buffer)) > 0) {
                output.write(buffer, 0, read)
            }
        }
    }
}

tasks.register("fetchModelAssets") {
    description = "下载并校验端侧识别模型资产（缺失或哈希不符时重新下载）"
    doLast {
        def tflite = new File(modelAssetsDir, "fish_classifier.tflite")
        if (!tflite.exists() || tflite.length() != classifierBytes || sha256Of(tflite) != classifierSha256) {
            logger.lifecycle("模型资产: 下载 fish_classifier.tflite（mobile-model-v0.2）…")
            downloadTo(classifierReleaseUrl, tflite)
            if (tflite.length() != classifierBytes || sha256Of(tflite) != classifierSha256) {
                throw new GradleException("fish_classifier.tflite 校验失败：SHA256/大小与 FishRecognitionEngine 常量不符")
            }
        }

        def onnx = new File(modelAssetsDir, "fish_detector_yolox_nano_v0_1.onnx")
        def metadata = new File(modelAssetsDir, "detector_metadata.json")
        def pipeline = new File(modelAssetsDir, "recognition_pipeline_v1.json")
        boolean detectorOk = false
        if (onnx.exists() && metadata.exists() && pipeline.exists()) {
            def metaJson = new groovy.json.JsonSlurper().parseText(metadata.text)
            detectorOk = onnx.length() == metaJson.onnx_bytes && sha256Of(onnx) == metaJson.onnx_sha256
        }
        if (!detectorOk) {
            logger.lifecycle("模型资产: 下载 detector bundle（detector-model-v0.1）…")
            def bundle = File.createTempFile("det_fish_v0_1", ".zip")
            bundle.deleteOnExit()
            try {
                downloadTo(detectorBundleUrl, bundle)
                def zip = new java.util.zip.ZipFile(bundle)
                try {
                    modelAssetsDir.mkdirs()
                    zip.entries().each { entry ->
                        def name = entry.getName().split('/').last()
                        if (!entry.isDirectory() && detectorBundleMembers.contains(name)) {
                            zip.getInputStream(entry).withCloseable { input ->
                                new File(modelAssetsDir, name).withOutputStream { output -> output << input }
                            }
                        }
                    }
                } finally {
                    zip.close()
                }
                // 安装后复验：metadata 必须与 onnx 二进制配套
                def metaJson = new groovy.json.JsonSlurper().parseText(metadata.text)
                if (onnx.length() != metaJson.onnx_bytes || sha256Of(onnx) != metaJson.onnx_sha256) {
                    throw new GradleException("detector bundle 校验失败：onnx 与 detector_metadata.json 不配套")
                }
            } finally {
                bundle.delete()
            }
        }
        logger.lifecycle("模型资产: 校验通过（classifier + detector 均就位）")
    }
}

preBuild.dependsOn("fetchModelAssets")

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // 渔见端侧推理链路（与原 Android 工程同版本）
    implementation("org.tensorflow:tensorflow-lite:2.16.1")
    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.29.0")
    implementation("androidx.exifinterface:exifinterface:1.3.7")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")

    // AR 自动量尺（ARCore：GMS 设备；华为 AR Engine：华为/荣耀 HMS 设备；
    // 均为 optional：不支持时回落手动量尺）
    implementation("com.google.ar:core:1.49.0")
    implementation("com.huawei.hms:arenginesdk:3.1.0.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.core:core:1.16.0'
        force 'androidx.core:core-ktx:1.16.0'
    }
    exclude group: 'com.android.support', module: 'support-v4'
    exclude group: 'com.android.support', module: 'support-compat'
}

